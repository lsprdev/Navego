name: navego

services:
  navego-browser-image:
    build:
      context: .
      dockerfile: docker/chromium/Dockerfile
    image: navego-browser:production
    entrypoint: ["/bin/true"]
    restart: "no"

  navego-control:
    build:
      context: .
      dockerfile: Dockerfile
      target: control
    image: navego-control:production
    command: ["serve", "--http=0.0.0.0:8090"]
    environment:
      NAVEGO_DATA_DIR: /data
      NAVEGO_AGENT_TOKEN: ${NAVEGO_AGENT_TOKEN:?Set NAVEGO_AGENT_TOKEN}
      NAVEGO_WORKER_API_KEY: ${NAVEGO_WORKER_API_KEY:?Set NAVEGO_WORKER_API_KEY}
      NAVEGO_VAULT_KEY: ${NAVEGO_VAULT_KEY:?Set NAVEGO_VAULT_KEY}
      NAVEGO_PUBLIC_VIEWER_URL: https://browser.lspr.dev
      NAVEGO_PUBLIC_DASHBOARD_ORIGINS: https://browser.lspr.dev
    volumes:
      - pocketbase-data:/data
    networks:
      - navego-runtime
      - dokploy-network
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.navego-viewer.rule=Host(`browser.lspr.dev`) && (PathPrefix(`/viewer`) || Path(`/switch`))"
      - "traefik.http.routers.navego-viewer.priority=100"
      - "traefik.http.routers.navego-viewer.entrypoints=websecure"
      - "traefik.http.routers.navego-viewer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.navego-viewer.service=navego-viewer"
      - "traefik.http.services.navego-viewer.loadbalancer.server.port=8090"
      - "traefik.http.routers.navego-mcp.rule=Host(`mcp.browser.lspr.dev`) && (Path(`/mcp`) || PathPrefix(`/.well-known/`))"
      - "traefik.http.routers.navego-mcp.entrypoints=websecure"
      - "traefik.http.routers.navego-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.navego-mcp.service=navego-mcp"
      - "traefik.http.services.navego-mcp.loadbalancer.server.port=8090"

  navego-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: navego-web:production
    environment:
      NAVEGO_CONTROL_URL: http://navego-control:8090
      NAVEGO_PUBLIC_MCP_URL: https://mcp.browser.lspr.dev/mcp
    depends_on:
      - navego-control
    networks:
      - dokploy-network
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.navego-dashboard.rule=Host(`browser.lspr.dev`)"
      - "traefik.http.routers.navego-dashboard.priority=1"
      - "traefik.http.routers.navego-dashboard.entrypoints=websecure"
      - "traefik.http.routers.navego-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.navego-dashboard.loadbalancer.server.port=3000"

  navego-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    image: navego-runtime:production
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      NAVEGO_CONTROL_URL: http://navego-control:8090
      NAVEGO_AGENT_ID: ${NAVEGO_AGENT_ID:-primary}
      NAVEGO_AGENT_TOKEN: ${NAVEGO_AGENT_TOKEN:?Set NAVEGO_AGENT_TOKEN}
      NAVEGO_WORKER_API_KEY: ${NAVEGO_WORKER_API_KEY:?Set NAVEGO_WORKER_API_KEY}
      NAVEGO_BROWSER_IMAGE: navego-browser:production
      NAVEGO_WORKER_IMAGE: navego-runtime:production
      NAVEGO_DOCKER_NETWORK: navego-runtime
    depends_on:
      - navego-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - navego-runtime
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pocketbase-data:
    name: navego-pocketbase-data

networks:
  navego-runtime:
    name: navego-runtime
  dokploy-network:
    external: true
