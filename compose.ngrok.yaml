services:
  navego-control:
    environment:
      NAVEGO_PUBLIC_MCP_URL: ${NGROK_URL:?Set NGROK_URL to your assigned HTTPS ngrok domain}/mcp

  navego-web:
    environment:
      NAVEGO_PUBLIC_MCP_URL: ${NGROK_URL:?Set NGROK_URL to your assigned HTTPS ngrok domain}/mcp

  ngrok:
    image: ngrok/ngrok:3-alpine
    command: ["http", "navego-control:8090", "--inspect=false", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    depends_on:
      - navego-control
    networks:
      - navego-runtime
    restart: unless-stopped
