services:
  ngrok:
    image: ngrok/ngrok:3-alpine
    command: ["http", "navego-browser:8001", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      navego-browser:
        condition: service_healthy
    restart: unless-stopped
