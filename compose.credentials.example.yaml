services:
  navego-gateway:
    environment:
      MCP_SAVED_LOGINS_FILE: /run/secrets/navego-logins.json
      MCP_SAVED_LOGIN_SECRETS_DIR: /run/secrets
    secrets:
      - navego-logins.json
      - example-username
      - example-password

secrets:
  navego-logins.json:
    file: ./secrets/navego-logins.json
  example-username:
    file: ./secrets/example-username
  example-password:
    file: ./secrets/example-password
