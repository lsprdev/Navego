services:
  navego-browser:
    ports:
      - "127.0.0.1:8001:8001"

  navego-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: navego-gateway:local
    network_mode: service:navego-browser
    depends_on:
      navego-browser:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_CDP_ENDPOINT: http://127.0.0.1:9222
      MCP_API_KEY: ${NAVEGO_API_KEY:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-}
      MCP_OAUTH_ALLOWED_SUBJECTS: ${MCP_OAUTH_ALLOWED_SUBJECTS:-}
      MCP_OAUTH_DISCOVERY_TIMEOUT_MS: ${MCP_OAUTH_DISCOVERY_TIMEOUT_MS:-10000}
      MCP_ACTION_TIMEOUT_MS: ${MCP_ACTION_TIMEOUT_MS:-10000}
      MCP_NAVIGATION_TIMEOUT_MS: ${MCP_NAVIGATION_TIMEOUT_MS:-60000}
      MCP_SESSION_IDLE_TIMEOUT_MS: ${MCP_SESSION_IDLE_TIMEOUT_MS:-1800000}
      MCP_SNAPSHOT_MAX_CHARS: ${MCP_SNAPSHOT_MAX_CHARS:-12000}
      MCP_SNAPSHOT_MAX_ELEMENTS: ${MCP_SNAPSHOT_MAX_ELEMENTS:-150}
      HUMAN_TAKEOVER_URL: ${HUMAN_TAKEOVER_URL:-https://127.0.0.1:3001}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
