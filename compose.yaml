name: navego

services:
  navego-browser-image:
    profiles: [images]
    build:
      context: .
      dockerfile: docker/chromium/Dockerfile
    image: navego-browser:local
    entrypoint: ["/bin/true"]
    restart: "no"

  navego-control:
    build:
      context: .
      dockerfile: Dockerfile
      target: control
    image: navego-control:local
    command: ["serve", "--http=0.0.0.0:8090"]
    environment:
      NAVEGO_DATA_DIR: /data
      NAVEGO_AGENT_TOKEN: ${NAVEGO_AGENT_TOKEN:-local-agent-token-change-me}
      NAVEGO_WORKER_API_KEY: ${NAVEGO_WORKER_API_KEY:-local-worker-token-change-me}
      NAVEGO_VAULT_KEY: ${NAVEGO_VAULT_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      NAVEGO_PUBLIC_VIEWER_URL: ${NAVEGO_PUBLIC_VIEWER_URL:-http://127.0.0.1:8090}
      NAVEGO_PUBLIC_DASHBOARD_URL: ${NAVEGO_PUBLIC_DASHBOARD_URL:-http://127.0.0.1:3000}
      NAVEGO_PUBLIC_MCP_URL: ${NAVEGO_PUBLIC_MCP_URL:-http://127.0.0.1:8090/mcp}
      NAVEGO_PUBLIC_DASHBOARD_ORIGINS: ${NAVEGO_PUBLIC_DASHBOARD_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pocketbase-data:/data
    networks:
      - navego-runtime
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  navego-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: navego-web:local
    environment:
      NAVEGO_CONTROL_URL: http://navego-control:8090
      NAVEGO_PUBLIC_MCP_URL: ${NAVEGO_PUBLIC_MCP_URL:-http://127.0.0.1:8090/mcp}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - navego-control
    networks:
      - navego-runtime
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  navego-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    image: navego-runtime:local
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      NAVEGO_CONTROL_URL: http://navego-control:8090
      NAVEGO_AGENT_ID: ${NAVEGO_AGENT_ID:-primary}
      NAVEGO_AGENT_TOKEN: ${NAVEGO_AGENT_TOKEN:-local-agent-token-change-me}
      NAVEGO_WORKER_API_KEY: ${NAVEGO_WORKER_API_KEY:-local-worker-token-change-me}
      NAVEGO_BROWSER_IMAGE: navego-browser:local
      NAVEGO_WORKER_IMAGE: navego-runtime:local
      NAVEGO_DOCKER_NETWORK: navego-runtime
    depends_on:
      - navego-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - navego-runtime
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pocketbase-data:
    name: navego-pocketbase-data

networks:
  navego-runtime:
    name: navego-runtime
