name: navego

services:
  navego-browser:
    build:
      context: .
      dockerfile: docker/chromium/Dockerfile
    image: navego-browser:local
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
      CUSTOM_USER: ${CHROMIUM_USER:-abc}
      PASSWORD: ${CHROMIUM_PASSWORD:-}
      TITLE: Navego
      RESTART_APP: "true"
      # Page.captureScreenshot currently hangs with this image's Wayland
      # compositor. X11 keeps CDP capture deterministic on local and servers.
      PIXELFLUX_WAYLAND: ${PIXELFLUX_WAYLAND:-false}
      CHROME_CLI: >-
        --remote-debugging-port=9222
        --remote-debugging-address=127.0.0.1
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - browser-data:/config
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  browser-data:
    name: navego-browser-data
